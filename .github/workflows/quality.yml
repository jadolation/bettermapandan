name: Code Quality & Build Checks

on:
  pull_request:
    branches: [ main, master, GIS ]
  workflow_call:
    inputs:
      upload_pages:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Quality Tools
        run: pip install ruff radon

      - name: Lint & Function Length (Ruff)
        run: ruff check .

      - name: Cyclomatic Complexity (Radon)
        run: |
          OUTPUT=$(radon cc . -nd)
          if [ -n "$OUTPUT" ]; then
            echo "Error: High complexity functions found:"
            echo "$OUTPUT"
            exit 1
          fi

      - name: Maintainability Index (Radon)
        run: radon mi .

      - name: Check i18n Parity
        run: python check_i18n.py

  build:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install test dependencies
        run: |
          pip install -r requirements.txt pytest
          npm ci
          npm install --no-save --package-lock=false esbuild@0.28.2
      - name: Python regressions (includes Node wrapper)
        run: PYTHONDONTWRITEBYTECODE=1 python -B -m pytest -p no:cacheprovider tests/ -q
      - name: Explicit JavaScript runtime suite
        run: node --test tests/gis-runtime.cjs
      - name: Check locale parity
        run: python check_i18n.py
      - name: Build and stage once in isolated offline workspace
        env:
          GIS_ESBUILD_BINARY: ${{ github.workspace }}/node_modules/.bin/esbuild
        run: python build.py --isolated --offline
      - name: Install headless Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - name: Browser regressions and exact staged artifact
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          node tests/browser/gis-explorer.cjs --fixtures
          node tests/browser/gis-explorer.cjs --root "$PWD/_site"
      - name: Check oversized graphics in exact artifact
        run: |
          LARGE_FILES=$(find _site -type f -name '*.svg' -size +100k | grep -v '/assets/logo.svg' | grep -v '/assets/logo-no-white.svg' | grep -v '/assets/municipal-seal.svg' | grep -v '/assets/Pandan.svg' || true)
          if [ -n "$LARGE_FILES" ]; then
            echo "$LARGE_FILES"
            exit 1
          fi
      - name: Check internal links in exact artifact (no mutable checkout server)
        uses: lycheeverse/lychee-action@v2
        with:
          args: "--offline --root-dir '${{ github.workspace }}/_site' '_site/**/*.html'"
          fail: true
      - name: Upload only tested Pages artifact
        if: ${{ inputs.upload_pages == true && github.event_name != 'pull_request' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

name: Code Quality & Build Checks

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Quality Tools
        run: pip install ruff radon

      - name: Lint & Function Length (Ruff)
        run: ruff check .

      - name: Cyclomatic Complexity (Radon)
        run: |
          OUTPUT=$(radon cc . -nd)
          if [ -n "$OUTPUT" ]; then
            echo "Error: High complexity functions found:"
            echo "$OUTPUT"
            exit 1
          fi

      - name: Maintainability Index (Radon)
        run: radon mi .

      - name: Check i18n Parity
        run: python check_i18n.py

  build:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Setup and build site
        uses: ./.github/actions/setup-python-build

      - name: Check for oversized graphics
        run: |
          echo "Checking for SVGs > 100KB..."
          LARGE_FILES=$(find . -type f -name "*.svg" -size +100k 2>/dev/null | grep -v node_modules | grep -v '/assets/logo.svg' | grep -v '/assets/logo-no-white.svg' | grep -v '/assets/municipal-seal.svg' | grep -v '/assets/Pandan.svg' || true)
          if [ -n "$LARGE_FILES" ]; then
            echo "Error: The following SVGs exceed 100KB:"
            echo "$LARGE_FILES"
            exit 1
          fi
          echo "Oversized brand assets are excluded from this check."

      - name: Start local HTTP server for link checks
        run: |
          cat > /tmp/server.py << 'PYEOF'
          import http.server
          import socketserver
          import os
          import mimetypes

          class Handler(http.server.BaseHTTPRequestHandler):
              def find_path(self, path):
                  path = path.split('?', 1)[0].lstrip('/')
                  if path.endswith('/'):
                      path = path[:-1]
                  if path and os.path.exists(path):
                      return path
                  html = path + '.html'
                  if path and os.path.exists(html):
                      return html
                  index = os.path.join(path or '', 'index.html')
                  if os.path.exists(index):
                      return index
                  return path

              def do_GET(self):
                  new_path = self.find_path(self.path)
                  if not new_path or not os.path.exists(new_path):
                      self.send_error(404, 'File not found')
                      return
                  ctype = mimetypes.guess_type(new_path)[0] or 'application/octet-stream'
                  try:
                      with open(new_path, 'rb') as f:
                          content = f.read()
                  except OSError:
                      self.send_error(404, 'File not found')
                      return
                  self.send_response(200)
                  self.send_header('Content-Type', ctype)
                  self.send_header('Content-Length', str(len(content)))
                  self.end_headers()
                  self.wfile.write(content)

          with socketserver.TCPServer(('', 8000), Handler) as httpd:
              print('Serving at http://localhost:8000')
              httpd.serve_forever()
          PYEOF
          python3 /tmp/server.py >/tmp/http.log 2>&1 &
          echo $! > /tmp/http.pid
          for i in 1 2 3 4 5; do
            curl -fsS http://localhost:8000/ >/dev/null && break
            sleep 1
          done

      - name: Check Broken Links (Lychee)
        uses: lycheeverse/lychee-action@v2
        with:
          args: "http://localhost:8000 --exclude 'https://blgf.gov.ph/' --exclude 'https://coa.gov.ph/' --exclude 'https://foi.gov.ph/' --exclude 'https://mapandan.gov.ph/' --exclude 'https://psa.gov.ph/' --exclude 'https://www.pna.gov.ph/' --exclude 'https://dilg.gov.ph/'"
          fail: true

      - name: Stop local HTTP server
        if: always()
        run: |
          if [ -f /tmp/http.pid ]; then
            kill "$(cat /tmp/http.pid)" || true
          fi

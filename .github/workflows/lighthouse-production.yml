name: Production Lighthouse Monitor

on:
  schedule:
    - cron: '0 8 * * 1'  # Every Monday at 8:00 UTC
  workflow_dispatch:       # Allow manual trigger

jobs:
  lighthouse-production:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Lighthouse
        uses: ./.github/actions/setup-lighthouse

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli

      - name: Run Lighthouse against production
        run: |
          lhci autorun \
            --collect.url=https://bettermapandan.org/ \
            --collect.url=https://bettermapandan.org/services/ \
            --collect.url=https://bettermapandan.org/government/ \
            --collect.url=https://bettermapandan.org/legislative/ \
            --collect.url=https://bettermapandan.org/statistics/ \
            --collect.url=https://bettermapandan.org/transparency/ \
            --collect.url=https://bettermapandan.org/about/ \
            --collect.numberOfRuns=1 \
            --assert.config=.lighthouserc.json \
            --upload.target=temporary-public-storage

      - name: Upload Lighthouse Reports Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-lighthouse-reports
          path: .lighthouseci/

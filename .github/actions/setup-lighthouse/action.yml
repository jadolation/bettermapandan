name: "Setup Node.js and Lighthouse"
description: "Set up Node.js, install dependencies, and prepare for Lighthouse CI"
inputs:
  node-version:
    description: "Node.js version to use"
    default: "22"
    required: false
runs:
  using: "composite"
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: "npm"
    - name: Install Node dependencies
      run: npm ci || npm install

name: "Setup Python and Build Site"
description: "Checkout code, set up Python 3.11, and run the static site build"
inputs:
  python-version:
    description: "Python version to use"
    default: "3.11"
    required: false
runs:
  using: "composite"
  steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - name: Build static site
      run: python build.py

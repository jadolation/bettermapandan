<div class="card emergency-card">
  <img src="{{ASSET_BASE}}/assets/logos/{{LOGO}}" alt="{{LOGO_ALT}}" class="office-logo" width="64" height="64" loading="lazy" decoding="async" />
  <div class="emergency-card-content">
    <div class="emergency-card-header">
      <div>
        <h3>{{TITLE}}</h3>
        {{DESCRIPTION}}
      </div>
      <p class="emergency-card-phones">{{PHONES}}</p>
    </div>
  </div>
</div>

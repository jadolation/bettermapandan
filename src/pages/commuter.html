---
title: Better Mapandan Commuter
description: Locally reported transport places and fare ranges. Reference only; no routing.
---
<div id="commuter-page" class="commuter-page">
  <header class="commuter-hero"><h1>{C_TITLE}</h1><p>{C_CANDIDATE_WARNING}</p></header>
  <div class="commuter-workspace">
    <section class="commuter-map-section" aria-label="{C_MAP}">
      <div id="commuter-map" class="commuter-map" aria-label="{C_MAP}" data-boundary-url="/assets/gis/barangay-boundaries.geojson"></div>
      <p id="commuter-map-status" role="status">{C_FALLBACK}</p>
    </section>
    <section id="commuter-sheet" class="commuter-sheet" aria-label="{C_SHEET}">
      <div class="sheet-toolbar">
        <span class="sheet-handle" role="button" tabindex="0" aria-label="{C_SHEET_DRAG}" aria-controls="commuter-sheet-body"></span>
        <button type="button" class="sheet-explore" aria-controls="commuter-explore">{C_EXPLORE}</button>
        <div class="sheet-heading"><h2 id="commuter-sheet-title">{C_EXPLORE}</h2><p id="commuter-sheet-summary">{C_PROVISIONAL}</p></div>
        <details class="sheet-size-disclosure" hidden><summary aria-label="{C_SHEET}">&#8943;</summary><div class="sheet-sizes" role="group" aria-label="{C_SHEET}">
          <button type="button" data-sheet-state="collapsed">{C_SHEET_COLLAPSED}</button>
          <button type="button" data-sheet-state="half">{C_SHEET_HALF}</button>
          <button type="button" data-sheet-state="expanded">{C_SHEET_EXPANDED}</button>
        </div></details>
        <button type="button" class="sheet-close" hidden aria-label="{C_CLOSE}">&#215;</button>
      </div>
      <div id="commuter-sheet-body" class="commuter-sheet-body">
        <section id="commuter-explore">
        <div class="commuter-controls" hidden>
          <label class="commuter-sr-only" for="commuter-search">{C_SEARCH}</label>
          <input id="commuter-search" type="search" placeholder="{C_SEARCH}" autocomplete="off">
          <label class="commuter-sr-only" for="commuter-type">{C_FILTER}</label>
          <select id="commuter-type"><option value="">{C_ALL}</option><option value="minibus">{C_MINIBUS}</option><option value="jeepney">{C_JEEPNEY}</option><option value="tricycle">{C_TRICYCLE}</option><option value="multileg">{C_MULTILEG}</option></select>
          <button id="commuter-reset" type="button">{C_RESET}</button>
          <label class="show-all-places"><input id="commuter-show-all" type="checkbox" aria-controls="commuter-map">{C_SHOW_ALL_PLACES}</label>
          <p id="commuter-count" role="status"></p>
        </div>
        <div id="commuter-lines">{COMMUTER_ROUTES}</div>
        <noscript><p>{C_UNAVAILABLE}</p></noscript>
      <details class="commuter-directory"><summary>{C_DIRECTORY}</summary>
        <div id="transport-list" class="transport-list">{COMMUTER_DIRECTORY}</div>
      </details>
        </section>
        <section id="commuter-info" aria-labelledby="commuter-info-title" hidden>
          <h2 id="commuter-info-title" tabindex="-1">{C_SELECT}</h2><div id="commuter-info-body"></div>
        </section>
      </div>
    </section>
  </div>
</div>
<p id="commuter-selection-status" class="commuter-sr-only" role="status" aria-live="polite"></p>
<script id="commuter-data" type="application/json">{COMMUTER_DATA}</script>
<script defer src="/assets/commuter-map.min.js"></script>
